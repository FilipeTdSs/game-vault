name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gamevault
          POSTGRES_PASSWORD: gamevault
          POSTGRES_DB: game_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamevault -d game_vault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://gamevault:gamevault@localhost:5432/game_vault_test?schema=public
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      JWT_EXPIRES_IN: 15m

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint:check
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
